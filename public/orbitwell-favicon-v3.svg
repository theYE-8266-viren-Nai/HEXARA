<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .orbit { stroke: #075ad8; }
    .pulse { stroke: #7c20c7; }
    .dot { fill: #075ad8; }
    @media (prefers-color-scheme: dark) {
      .orbit { stroke: #2dd4ff; }
      .pulse { stroke: #d38cff; }
      .dot { fill: #2dd4ff; }
    }
  </style>
  <defs>
    <filter id="pop" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
      <feFlood flood-color="#075ad8" flood-opacity=".38" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#pop)" transform="translate(-2 -2) scale(1.08)">
    <path class="orbit" d="M15 53C7 53 5 48 7 43c4-11 22-24 41-27 8-1 13 1 14 5 1 5-2 10-8 14" stroke-width="4.8" stroke-linecap="round"/>
    <path class="pulse" d="M10 37h15l3-1 3-9 4 17 4-25 4 26 4-11 3 2h10" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="dot" cx="55" cy="13" r="5"/>
  </g>
</svg>
